name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hardening
            cmake_flags: "-DLOCALDROP_ENABLE_HARDENING=ON"
            ctest_labels: ""
          - name: asan
            cmake_flags: "-DLOCALDROP_ENABLE_HARDENING=OFF -DLOCALDROP_ENABLE_ASAN=ON"
            ctest_labels: ""
          - name: ubsan
            cmake_flags: "-DLOCALDROP_ENABLE_HARDENING=OFF -DLOCALDROP_ENABLE_UBSAN=ON"
            ctest_labels: ""
          - name: tsan
            cmake_flags: "-DLOCALDROP_ENABLE_HARDENING=OFF -DLOCALDROP_ENABLE_TSAN=ON"
            ctest_labels: "-L unit"

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            libcurl4-openssl-dev \
            libavahi-client-dev \
            libavahi-common-dev \
            libmicrohttpd-dev \
            libqrencode-dev \
            libssl-dev \
            pkg-config

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure ${{ matrix.ctest_labels }}
